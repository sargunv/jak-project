# :schema https://fnox.jdx.dev/schema.json

# Backups of the signing keys and passwords in the repository's Actions secrets, which GitHub can't
# read back. The names match the Actions secrets. `mise run secrets:push` copies them to GitHub.

default_provider = "age"

[providers.age]
type = "age"
recipients = [
  "age1uzca57akdzmyhyzxecxnt92fcwj652n9h6xhfkfzhqg4k4ljnuqstsdmap", # sargunv
]

[secrets]
# Sign the APK (android-build.yaml)
POCKETGOAL_KEYSTORE_BASE64 = { provider = "age", value = "" }
POCKETGOAL_KEYSTORE_PASSWORD = { provider = "age", value = "" }
POCKETGOAL_KEY_ALIAS = { provider = "age", value = "" }
POCKETGOAL_KEY_PASSWORD = { provider = "age", value = "" }

# Sign the F-Droid repo's index (android-fdroid.yaml)
FDROID_KEYSTORE_BASE64 = { provider = "age", value = "" }
FDROID_KEYSTORE_PASSWORD = { provider = "age", value = "" }
